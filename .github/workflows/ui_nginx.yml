name: UI Nginx GitOps Validation

on:
  push:
    branches:
      - main
    paths:
      - 'Day_04_first_app_deployment/ui_approach/nginx/**'

  pull_request:
    branches:
      - main
    paths:
      - 'Day_04_first_app_deployment/ui_approach/nginx/**'

  workflow_dispatch:

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Deployment Manifest
        run: |
          kubeconform \
          Day_04_first_app_deployment/ui_approach/nginx/nginx_deployment.yml

      - name: Validate Service Manifest
        run: |
          kubeconform \
          Day_04_first_app_deployment/ui_approach/nginx/nginx_svc.yml

      - name: Summary
        run: |
          echo "✅ Kubernetes manifests validated successfully"
          echo "✅ ArgoCD will automatically sync changes from Git"